[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-telemetry"
version = "1.0.0"
description = "Token Telemetry Proxy for Vibe CLI - Track API calls, token usage, and costs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Mistral Vibe", email = "vibe@mistral.ai"}
]
keywords = ["telemetry", "token", "api", "proxy", "mistral", "vibe"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]

[project.scripts]
token-telemetry = "token_telemetry.cli:main"
telemetry-proxy = "token_telemetry.proxy:main"
telemetry-report = "token_telemetry.reporter:main"

[project.urls]
Homepage = "https://github.com/mistralai/token-telemetry"
Documentation = "https://github.com/mistralai/token-telemetry#readme"
Repository = "https://github.com/mistralai/token-telemetry"
Issues = "https://github.com/mistralai/token-telemetry/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["token_telemetry*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["token_telemetry"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
exclude = [".venv", "build", "dist"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src/token_telemetry --cov-report=term-missing"

[tool.coverage.run]
source = ["src/token_telemetry"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
